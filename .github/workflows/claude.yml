name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check authorization
        id: auth-check
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const username = context.actor;

            // Check if user has write (or admin) access to the repo
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username,
            });

            const permission = data.permission;
            console.log(`${username} has '${permission}' permission on this repo`);

            if (permission === 'admin' || permission === 'write') {
              console.log(`✅ ${username} is authorized`);
              return 'authorized';
            }

            console.log(`❌ ${username} is not authorized (needs write or admin access)`);
            return 'unauthorized';

      - name: Post unauthorized comment
        if: steps.auth-check.outputs.result == 'unauthorized'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = context.actor;
            const issueNumber = context.issue?.number || context.payload.issue?.number || context.payload.pull_request?.number;

            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `👋 @${username}, you're not currently authorized to use Claude on this repository.\n\nTo use Claude, you need write or admin access to this repository. Please contact a repository administrator if you believe you should have access.`
              });
            }

            core.setFailed(`User ${username} is not authorized to use Claude.`)

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # fallow:audit diffs against origin/main

      # Same toolchain as CI, so Claude can run the checks CI will run on its PR
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm ii
        shell: bash
      - name: Install drift
        run: |
          curl -sL https://github.com/fiberplane/drift/releases/download/v0.10.0/drift-x86_64-linux.tar.gz | tar xz
          sudo mv drift /usr/local/bin/

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # Payload commands (generate:types, migrate:create, seed:standalone) need these to boot.
          # A placeholder secret is enough for a local file DB; never hand the agent a real one.
          DATABASE_URI: 'file:./dev.db'
          PAYLOAD_SECRET: 'claude-workflow-placeholder-secret'
          ALLOW_SIMPLE_PASSWORDS: 'true'
          # Matches CI's prettier job so generate:importmap keeps the blob upload handler; never used to upload
          VERCEL_BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_commit_signing: true

          # Limit tools to safe operations for this codebase
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(pnpm prettify),Bash(pnpm prettier --check *),Bash(pnpm tsc),Bash(pnpm lint),Bash(pnpm verify-type-assertions),Bash(pnpm afp-golden:check),Bash(pnpm test),Bash(pnpm test *),Bash(pnpm generate:types),Bash(pnpm generate:importmap),Bash(pnpm drift:check),Bash(drift link *),Bash(drift unlink *),Bash(drift refs *),Bash(pnpm fallow:audit --changed-since origin/main),Bash(pnpm fallow:check),Bash(pnpm payload migrate:create *),Bash(pnpm migrate:check),Bash(pnpm migrate:check *),Bash(pnpm seed:standalone),Bash(git status),Bash(git diff),Bash(git add),Bash(git commit),Bash(git checkout -b *),Bash(git push),Bash(gh pr create *),Bash(gh issue comment *),mcp__github_inline_comment__create_inline_comment"
            --system-prompt "OVERRIDE: Do NOT provide a manual 'Create a PR' URL link. Instead, after implementing changes for a GitHub issue, you MUST actually create a pull request by running 'gh pr create' via the Bash tool. Always use 'gh pr create' directly — never just provide a compare URL. The PR body must follow the template in .github/PULL_REQUEST_TEMPLATE.md with these sections: Description, Related Issues, Key Changes, How to test, Screenshots / Demo video, Migration Explanation, Future enhancements / Questions. Omit sections that are not applicable (e.g. Screenshots, Migration Explanation). In the Related Issues section, always use the closing keyword 'Closes #<issue_number>' so the issue is automatically closed when the PR is merged. The user who requested this workflow is '${{ github.actor }}'. Always assign them to the PR and request their review using the --assignee and --reviewer flags on gh pr create. Before every push, run the checks CI runs and fix what they report: 'pnpm prettier --check .', 'pnpm lint', 'pnpm tsc', 'pnpm test', 'pnpm generate:types' and 'pnpm generate:importmap' (commit any changes they make), 'pnpm drift:check', and 'pnpm fallow:audit --changed-since origin/main' plus 'pnpm fallow:check'."
